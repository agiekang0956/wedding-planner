<body><div id="weddingCloudGate"><div id="weddingCloudBox"><h2>☁ MarryPlan 공유 플래너</h2><div id="weddingCloudMsg">Firebase 연결을 준비하고 있습니다…</div><div id="weddingSyncStatus"></div><button class="primary" id="weddingLogin" hidden>Google 계정으로 로그인</button><button class="primary" id="weddingSeedLocal" hidden>이 브라우저의 일정으로 최초 등록</button><button id="weddingSeedEmpty" hidden>기본 웨딩 일정으로 최초 등록</button><button id="weddingRetry" hidden>다시 연결</button></div></div><div class="layout"><aside class="sidebar"><div class="brand">MarryPlan <small>OUR WEDDING JOURNEY</small></div><nav class="menu" id="menu"></nav><div class="side-bottom">🌷 우리의 특별한 하루까지<br><b>함께 하나씩 준비해요.</b><br><span id="sideCountdown"></span></div></aside><main class="main"><header class="top"><div><div class="eyebrow">WEDDING PLANNER</div><h1 id="pageTitle">우리의 결혼 준비</h1></div><div class="top-actions"><span class="date-pill" id="weddingBadge"></span><button class="btn" onclick="exportPlanner()" title="일정과 지출 데이터 백업">↓ 백업</button><button class="btn" onclick="document.getElementById('plannerImport').click()" title="백업한 데이터 불러오기">↑ 복원</button><button class="btn" onclick="openSettings()">⚙ 설정</button></div></header><section id="dashboard" class="view active"></section><section id="checklist" class="view"></section><section id="calendar" class="view"></section><section id="timeline" class="view"></section><section id="comparison" class="view"></section><section id="budget" class="view"></section></main></div><input id="plannerImport" type="file" accept=".json,application/json" style="display:none" onchange="importPlanner(event)">

<script>
const STORAGE='marryplan_v2';
const LEGACY_STORAGE='marryplan_v1';
const today=new Date();
const iso=(d)=>{let x=new Date(d);return [x.getFullYear(),String(x.getMonth()+1).padStart(2,'0'),String(x.getDate()).padStart(2,'0')].join('-')};
const datePlus=(days)=>{let d=new Date();d.setDate(d.getDate()+days);return iso(d)};
const money=n=>(Number(n)||0).toLocaleString('ko-KR')+'원';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);

const TASK_COLORS=[
  {id:'rose',name:'스드메',dot:'#cf7f8a',bg:'#f9eaee',fg:'#9b5562'},
  {id:'peach',name:'부모님',dot:'#e2a470',bg:'#fff1e3',fg:'#a56629'},
  {id:'yellow',name:'집',dot:'#d8ba57',bg:'#fff7d7',fg:'#8c730f'},
  {id:'green',name:'예물예복',dot:'#73b39b',bg:'#eaf7f1',fg:'#3f7a66'},
  {id:'blue',name:'신행',dot:'#7ea5e8',bg:'#edf3ff',fg:'#4568a2'},
  {id:'gray',name:'그 외',dot:'#9a9ba4',bg:'#f1f1f4',fg:'#5f626c'}
];
const EXPENSE_MARKS=[
  {id:'blue',name:'람',dot:'#7ea5e8',bg:'#edf3ff',fg:'#4568a2'},
  {id:'pink',name:'째',dot:'#d38cba',bg:'#fcecf6',fg:'#a45483'}
];
const taskColorMap=Object.fromEntries(TASK_COLORS.map(c=>[c.id,c]));
const expenseMarkMap=Object.fromEntries(EXPENSE_MARKS.map(c=>[c.id,c]));
const getTaskColor=id=>taskColorMap[id]||TASK_COLORS[0];

  let categories=seeds.map(([icon,name,subs])=>({
    id:uid(),icon,name,open:true,
    subs:subs.map(([name,items])=>({
      id:uid(),name,
      tasks:items.map((title,i)=>({id:uid(),title,done:false,date:i===0?datePlus(30):'',cost:0,color:'rose'}))
    }))
  }));
  return {
    weddingDate:datePlus(240),
    totalBudget:30000000,
    categories,
    quotes:[
      {id:uid(),category:'웨딩홀 · 식장',vendor:'로즈가든 웨딩홀 (예시)',price:7800000,details:'식대·대관료 포함 견적 예시',chosen:false},
      {id:uid(),category:'웨딩홀 · 식장',vendor:'가든팰리스 (예시)',price:8900000,details:'보증인원 조건 확인 필요',chosen:false},
      {id:uid(),category:'웨딩촬영',vendor:'모먼트 스튜디오 (예시)',price:1750000,details:'원본 비용 별도 여부 확인',chosen:false}
    ],
    expenses:[]
  };
}

function normalizeState(s){
  if(!s||!s.categories)return initial();
  s.quotes=s.quotes||[];
  s.expenses=s.expenses||[];
  s.categories.forEach(c=>{
    c.open = c.open!==false;
    c.subs = c.subs||[];
    c.subs.forEach(sub=>{
      sub.tasks=sub.tasks||[];
      sub.tasks.forEach(t=>{
        t.done=!!t.done;
        t.date=t.date||'';
        t.cost=Number(t.cost)||0;
        t.color=t.color||'rose';
      });
    });
  });
  s.expenses.forEach(x=>{
    x.date=x.date||iso(today);
    x.amount=Number(x.amount)||0;
    x.payer=x.payer||'';
    x.mark=x.mark||'blue';
  });
  return s;
}

function loadState(){
  try{
    const current=localStorage.getItem(STORAGE);
    const legacy=localStorage.getItem(LEGACY_STORAGE);
    return normalizeState(JSON.parse(current||legacy)||initial());
  }catch(e){
    return initial();
  }
}
state=loadState();
function persist(){try{localStorage.setItem(STORAGE,JSON.stringify(state));}catch(e){console.warn('브라우저 저장소 사용 불가',e);}if(window.__weddingCloudSave)window.__weddingCloudSave(JSON.parse(JSON.stringify(state)));}

const allTasks=()=>state.categories.flatMap(c=>c.subs.flatMap(s=>s.tasks.map(t=>({...t,category:c.name,catId:c.id,sub:s.name,subId:s.id}))));
const completed=()=>allTasks().filter(t=>t.done).length;
const byId=(id)=>{for(const c of state.categories)for(const s of c.subs){const task=s.tasks.find(t=>t.id===id);if(task)return task}return null};
const spent=()=>state.expenses.reduce((a,e)=>a+Number(e.amount||0),0);

function renderCalendar(){

  }

  let grouped={}; for(let x of q)(grouped[x.category]??=[]).push(x);
  document.getElementById('comparison').innerHTML=`<div class="section-head" style="margin-top:0"><div><h2>업체별 견적 한눈에 비교</h2><p class="muted">견적을 직접 입력하여 가격과 포함 항목을 비교하세요. 초기 데이터는 예시입니다.</p></div><button class="btn primary" onclick="openQuote()">+ 업체 견적 등록</button></div><div class="filters"><button class="filter ${compareFilter==='all'?'active':''}" onclick="compareFilter='all';render()">전체</button>${categories.map(c=>`<button class="filter ${compareFilter===c?'active':''}" onclick="compareFilter='${esc(c).replace(/'/g,'&#39;')}';render()">${esc(c)}</button>`).join('')}</div>${Object.entries(grouped).map(([cat,quotes])=>{let min=Math.min(...quotes.map(x=>Number(x.price)));return `<div class="section-head"><h2>${esc(cat)}</h2><span class="muted">${quotes.length}개 업체</span></div><div class="table-wrap"><table><thead><tr><th>업체명</th><th>견적 금액</th><th>세부 조건 및 메모</th><th>선택</th><th>관리</th></tr></thead><tbody>${quotes.sort((a,b)=>a.price-b.price).map(x=>`<tr><td><b>${esc(x.vendor)}</b> ${Number(x.price)===min&&quotes.length>1?'<span class="badge-best">최저가</span>':''}</td><td class="money">${money(x.price)}</td><td class="muted">${esc(x.details)}</td><td><input type="checkbox" aria-label="선택" ${x.chosen?'checked':''} onchange="chooseQuote('${x.id}')"></td><td><button class="subtle" onclick="openQuote('${x.id}')">수정</button><button class="iconbutton" onclick="removeItem('quote','${x.id}')">×</button></td></tr>`).join('')}</tbody></table></div>`}).join('')||'<div class="card empty">등록된 업체가 없습니다.</div>'}`;
}
function chooseQuote(id){let q=state.quotes.find(q=>q.id===id);if(q){q.chosen=!q.chosen;persist();render()}}

function renderBudget(){
  let sum=spent(),pct=state.totalBudget?Math.round(sum/state.totalBudget*100):0;
  let expenses=[...state.expenses].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  let payerTotals=new Map();
  for(const x of state.expenses){const key=String(x.payer||'').trim()||'미지정';payerTotals.set(key,(payerTotals.get(key)||0)+Number(x.amount||0));}
  const payerCards=[...payerTotals.entries()].sort((a,b)=>b[1]-a[1]).map(([payer,total])=>`<div class="card stat"><div class="tag">${esc(payer)} 지출 합계</div><strong>${money(total)}</strong><div class="sub">전체 지출의 ${sum?(total/sum*100).toFixed(1):'0.0'}%</div></div>`).join('');
  const categoryTotals=new Map(state.categories.map(c=>[c.name,0]));
  for(const x of state.expenses){const name=String(x.category||'').trim()||'미분류';categoryTotals.set(name,(categoryTotals.get(name)||0)+Number(x.amount||0));}
  const categoryRows=[...categoryTotals.entries()].map(([category,total])=>`<tr><td>${esc(category)}</td><td class="money">${money(total)}</td><td>${sum?(total/sum*100).toFixed(1):'0.0'}%</td></tr>`).join('');

  document.getElementById('budget').innerHTML=`<div class="grid"><div class="card stat"><div class="tag">총예산</div><strong>${money(state.totalBudget)}</strong></div><div class="card stat"><div class="tag">현재 지출</div><strong>${money(sum)}</strong></div><div class="card stat"><div class="tag">남은 예산</div><strong>${money(state.totalBudget-sum)}</strong></div><div class="card stat"><div class="tag">예산 사용률</div><strong>${pct}%</strong></div></div><div class="section-head"><h2>전체 예산 현황</h2><button class="btn" onclick="openSettings()">총예산 수정</button></div><div class="card"><div class="budget-bar"><i style="width:${Math.min(100,pct)}%;background:${pct>100?'#d85c5c':'#b56d77'}"></i></div><p class="muted">${pct>100?'설정된 예산을 초과했습니다.':'총예산 대비 실제 지출 비율입니다.'}</p></div><div class="section-head"><h2>정산자별 지출 합계</h2><span class="muted">정산자 입력값 기준 자동 합산</span></div><div class="grid payer-totals">${payerCards||'<div class="card empty">지출 내역을 등록하면 정산자별 합계가 표시됩니다.</div>'}</div><div class="section-head"><h2>대분류별 지출 합계</h2><span class="muted">체크리스트 대분류 기준</span></div><div class="table-wrap"><table style="min-width:320px"><thead><tr><th>대분류</th><th>지출 합계</th><th>비율</th></tr></thead><tbody>${categoryRows}</tbody></table></div><div class="section-head"><h2>지출 내역</h2><button class="btn primary" onclick="openExpense()">+ 지출 등록</button></div><div class="table-wrap"><table class="expense-table"><thead><tr><th>지출일</th><th>분류 (대분류)</th><th>정산자</th><th>내역</th><th>금액</th><th>관리</th></tr></thead><tbody>${expenses.map(x=>`<tr><td>${fmtDate(x.date)}</td><td>${esc(x.category)}</td><td>${payerPill(x.payer)}</td><td><b class="expense-title">${esc(x.title)}</b></td><td class="money">${money(x.amount)}</td><td><button class="subtle" onclick="openExpense('${x.id}')">수정</button><button class="iconbutton" onclick="removeItem('expense','${x.id}')">×</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">지출 내역을 등록해 주세요.</td></tr>'}</tbody></table></div>`;
}

function optionCats(selected=''){return state.categories.map(c=>`<option value="${esc(c.id)}" ${selected===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}
function optionSubs(catId,sel=''){let c=state.categories.find(c=>c.id===catId);return (c?.subs||[]).map(s=>`<option value="${esc(s.id)}" ${sel===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}
function field(label,name,value='',type='text',attr=''){return `<div class="field"><label for="f_${name}">${label}</label><input class="input" id="f_${name}" name="${name}" type="${type}" value="${esc(value)}" ${attr}></div>`}
function selectField(label,name,options){return `<div class="field"><label for="f_${name}">${label}</label><select name="${name}" id="f_${name}" class="input">${options}</select></div>`}
function textareaField(label,name,value='',rows=3){return `<div class="field"><label for="f_${name}">${label}</label><textarea id="f_${name}" name="${name}" rows="${rows}">${esc(value)}</textarea></div>`}
function choiceField(label,name,options,selected){return `<div class="field"><label>${label}</label><div class="choice-grid">${options.map(o=>`<input class="choice-input" type="radio" name="${name}" id="f_${name}_${o.id}" value="${o.id}" ${selected===o.id?'checked':''}><label class="choice-label" for="f_${name}_${o.id}" style="--choice-bg:${o.bg};--choice-fg:${o.fg};--choice-dot:${o.dot}"><span class="choice-dot"></span><span>${esc(o.name)}</span></label>`).join('')}</div></div>`}
function openDialog(kind,title,html,id=null){dialogKind=kind;editingId=id;document.getElementById('dialogTitle').textContent=title;document.getElementById('dialogFields').innerHTML=html;document.getElementById('modal').showModal()}
function closeDialog(){document.getElementById('modal').close()}

function openSettings(){openDialog('settings','결혼식 기본 설정',field('결혼식 날짜','weddingDate',state.weddingDate,'date','required')+field('총예산 (원)','totalBudget',state.totalBudget,'number','min="0" required'))}
function openCategory(id){let c=state.categories.find(c=>c.id===id);openDialog('category',c?'대분류 수정':'대분류 추가',field('아이콘 (이모지)','icon',c?.icon||'💗')+field('대분류 이름','name',c?.name||'','text','required'),id)}
function openSub(catId,subId){let s=state.categories.find(c=>c.id===catId)?.subs.find(s=>s.id===subId);openDialog('sub',s?'중분류 수정':'중분류 추가',selectField('대분류','catId',optionCats(catId))+field('중분류 이름','name',s?.name||'','text','required'),subId)}
function openTask(id,catId,subId,date){
  let t=id?allTasks().find(t=>t.id===id):null,cat=t?.catId||catId||state.categories[0]?.id,sub=t?.subId||subId||state.categories.find(c=>c.id===cat)?.subs[0]?.id;
  let html=field('할 일','title',t?.title||'','text','required')+selectField('대분류','catId',optionCats(cat))+selectField('중분류','subId',optionSubs(cat,sub))+field('예정일','date',t?.date||date||'','date')+field('예상 비용 (원)','cost',t?.cost||0,'number','min="0"')+choiceField('색상 포인트','color',TASK_COLORS,t?.color||'rose');
  openDialog('task',t?'할 일 수정':'할 일 추가',html,id);
  document.getElementById('f_catId').onchange=e=>{document.getElementById('f_subId').innerHTML=optionSubs(e.target.value)};
}
function openQuote(id){let q=state.quotes.find(x=>x.id===id);let opts=state.categories.map(c=>`<option ${q?.category===c.name?'selected':''}>${esc(c.name)}</option>`).join('');openDialog('quote',q?'견적 수정':'업체 견적 추가',selectField('준비 항목','category',opts)+field('업체명','vendor',q?.vendor||'','text','required')+field('견적 금액 (원)','price',q?.price||0,'number','min="0" required')+textareaField('포함 사항 / 비교 메모','details',q?.details||'',3),id)}
function openExpense(id){
  let x=state.expenses.find(x=>x.id===id);
  // 지출 분류는 체크리스트 대분류(state.categories)에서만 선택한다.
  let opts=state.categories.map(c=>`<option value="${esc(c.name)}" ${x?.category===c.name?'selected':''}>${esc(c.name)}</option>`).join('');
  // 과거 백업에 있는 삭제된 대분류 항목도 수정 중에는 유지할 수 있게 한다.
  if(x?.category&&!state.categories.some(c=>c.name===x.category))opts+=`<option value="${esc(x.category)}" selected>${esc(x.category)} (이전 분류)</option>`;
  let payers=['람','째','공동'];
  if(x?.payer&&!payers.includes(x.payer))payers.push(x.payer);
  let payerOpts='<option value="">정산자 선택</option>'+payers.map(name=>`<option value="${esc(name)}" ${x?.payer===name?'selected':''}>${esc(name)}</option>`).join('');
  let html=field('지출일','date',x?.date||iso(today),'date','required')+selectField('분류 (대분류)','category',opts)+field('내역','title',x?.title||'','text','required')+field('지출 금액 (원)','amount',x?.amount||0,'number','min="0" required')+selectField('정산자','payer',payerOpts);
  openDialog('expense',x?'지출 내역 수정':'지출 내역 추가',html,id)
}

function saveDialog(e){
  e.preventDefault();
  let fd=Object.fromEntries(new FormData(document.getElementById('dialogForm')).entries()),id=editingId;
  switch(dialogKind){
    case 'settings':
      state.weddingDate=fd.weddingDate; state.totalBudget=+fd.totalBudget; break;
    case 'category':
      if(id) Object.assign(state.categories.find(x=>x.id===id),{name:fd.name,icon:fd.icon});
      else state.categories.push({id:uid(),name:fd.name,icon:fd.icon||'💗',open:true,subs:[]});
      break;
    case 'sub':
      if(id){
        let found=state.categories.flatMap(c=>c.subs).find(x=>x.id===id);
        let old=state.categories.find(c=>c.subs.some(s=>s.id===id));
        if(old.id!==fd.catId){old.subs=old.subs.filter(s=>s.id!==id);state.categories.find(c=>c.id===fd.catId).subs.push(found)}
        found.name=fd.name;
      }else state.categories.find(c=>c.id===fd.catId).subs.push({id:uid(),name:fd.name,tasks:[]});
      break;
    case 'task':{
      let target=state.categories.find(c=>c.id===fd.catId)?.subs.find(s=>s.id===fd.subId);
      if(!target){alert('먼저 중분류를 추가해 주세요.');return}
      let task=id?byId(id):null;
      if(task){for(let c of state.categories)for(let s of c.subs)s.tasks=s.tasks.filter(t=>t.id!==id)}
      else task={id:uid(),done:false};
      Object.assign(task,{title:fd.title,date:fd.date,cost:+fd.cost,color:fd.color||'rose'});
      target.tasks.push(task); break;
    }
    case 'quote':{
      let q=id?state.quotes.find(x=>x.id===id):{id:uid(),chosen:false};
      Object.assign(q,{category:fd.category,vendor:fd.vendor,price:+fd.price,details:fd.details});
      if(!id)state.quotes.push(q); break;
    }
    case 'expense':{
      let x=id?state.expenses.find(x=>x.id===id):{id:uid()};
      Object.assign(x,{date:fd.date,category:fd.category,title:fd.title,amount:+fd.amount,payer:fd.payer||'',mark:x.mark||'blue'});
      if(!id)state.expenses.push(x); break;
    }
  }
  persist(); closeDialog(); render();
}

function removeItem(type,id){
  if(!confirm('이 항목을 삭제할까요? 하위 항목도 함께 삭제될 수 있습니다.'))return;
  if(type==='category'){state.categories=state.categories.filter(c=>c.id!==id);categoryFilter='all'}
  if(type==='task'){for(let c of state.categories)for(let s of c.subs)s.tasks=s.tasks.filter(t=>t.id!==id)}
  if(type==='quote')state.quotes=state.quotes.filter(q=>q.id!==id)
  if(type==='expense')state.expenses=state.expenses.filter(q=>q.id!==id)
  persist(); render();
}


function exportPlanner(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json;charset=utf-8'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url;a.download='웨딩플래너_백업_'+iso(new Date())+'.json';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
}
async function importPlanner(e){
  const f=e.target.files&&e.target.files[0]; if(!f)return;
  try{
    const data=JSON.parse(await f.text());
    if(!data||!Array.isArray(data.categories)||!Array.isArray(data.expenses)){throw new Error('백업 파일 형식이 맞지 않습니다.');}
    if(!confirm('현재 브라우저에 저장된 데이터를 백업 파일 내용으로 교체할까요?'))return;
    state=normalizeState(data);persist();render();alert('불러오기가 완료되었습니다.');
  }catch(err){alert('불러오기 실패: '+err.message)}finally{e.target.value='';}
}

render();
window.__getWeddingLocal=()=>JSON.parse(JSON.stringify(state));
window.__getWeddingDefault=()=>initial();
window.__applyWeddingCloud=(incoming)=>{state=normalizeState(JSON.parse(JSON.stringify(incoming)));try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch(e){}render();};
</script>
<script type="module">

import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult,onAuthStateChanged,setPersistence,browserLocalPersistence} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getFirestore,doc,onSnapshot,runTransaction} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const config={apiKey:'AIzaSyDW2b8vZjfJqwhhVvtIvX_JRxck8mSwILg',authDomain:'sapporo-planner.firebaseapp.com',projectId:'sapporo-planner',storageBucket:'sapporo-planner.firebasestorage.app',messagingSenderId:'220268391902',appId:'1:220268391902:web:97cad879168d9b0d1c414f'};
const el=id=>document.getElementById(id),gate=el('weddingCloudGate'),msg=el('weddingCloudMsg'),login=el('weddingLogin'),seedLocal=el('weddingSeedLocal'),seedEmpty=el('weddingSeedEmpty'),retry=el('weddingRetry'),status=el('weddingSyncStatus');
const say=text=>msg.textContent=text;
let app,auth,db,ref,user=null,unsub=null,ready=false,revision=0,pendingCount=0,queue=Promise.resolve(),saveFailed=false,knownDoc=false;
const show=(mode,text)=>{gate.hidden=false;say(text);login.hidden=mode!=='login';seedLocal.hidden=mode!=='seed';seedEmpty.hidden=mode!=='seed';retry.hidden=mode!=='retry';};
try{app=initializeApp(config,'wedding-app');auth=getAuth(app);db=getFirestore(app);ref=doc(db,'planners','wedding-shared');}catch(e){show('retry','Firebase 초기화 실패: '+e.message)}
function beginWatch(){if(unsub)unsub();unsub=onSnapshot(ref,snap=>{
 if(!snap.exists()){knownDoc=false;ready=false;window.__weddingCloudSave=null;show('seed','공유 웨딩 데이터가 아직 없습니다. 한 기기에서만 최초 등록하세요.\n기존 데이터가 있다면 「이 브라우저의 일정」을 선택하세요.');return;}
 const value=snap.data();if(!value||!value.planner||!Array.isArray(value.planner.categories)){show('retry','클라우드 웨딩 데이터 형식이 올바르지 않습니다.');return;}
 knownDoc=true;
 if(pendingCount===0&&!saveFailed){revision=Number(value.revision)||0;window.__applyWeddingCloud(value.planner);status.textContent='☁ 최신 공유 일정 동기화 완료';}
 if(!saveFailed){ready=true;gate.hidden=true;window.__weddingCloudSave=cloudSave;}
},err=>{ready=false;window.__weddingCloudSave=null;show('retry','공유 일정 조회 실패: '+(err.code||err.message)+'\nFirestore 규칙 및 허용된 Google 계정을 확인하세요.');});}
if(auth){setPersistence(auth,browserLocalPersistence).catch(()=>{});getRedirectResult(auth).catch(e=>say('로그인 복귀 실패: '+e.message));onAuthStateChanged(auth,u=>{user=u;ready=false;saveFailed=false;window.__weddingCloudSave=null;gate.hidden=false;if(unsub){unsub();unsub=null;}if(u){show('none','로그인됨: '+u.email+'\n공유 웨딩 일정을 불러오는 중…');beginWatch()}else show('login','허용된 Google 계정으로 로그인해 주세요.');});}
login.onclick=async()=>{try{login.disabled=true;say('Google 로그인 중…');await signInWithPopup(auth,new GoogleAuthProvider());}catch(e){show('login','Google 로그인 실패: '+(e.code||e.message)+'\nSafari에서는 일반 Safari 탭에서 열어 다시 시도하세요.');}finally{login.disabled=false;}};
retry.onclick=()=>{saveFailed=false;if(user)beginWatch();else show('login','Google 계정으로 로그인해 주세요.');};
async function seed(payload){if(!user)return;show('none','클라우드에 최초 웨딩 일정을 저장하고 있습니다…');try{await runTransaction(db,async tx=>{const snap=await tx.get(ref);if(snap.exists())throw Error('이미 공유 일정이 등록되었습니다. 새로고침 후 확인하세요.');tx.set(ref,{planner:payload,revision:1,updatedAt:new Date().toISOString()});});}catch(e){show('seed','초기 등록 실패: '+e.message);}}
seedLocal.onclick=()=>seed(window.__getWeddingLocal());seedEmpty.onclick=()=>seed(window.__getWeddingDefault());
function cloudSave(payload){if(!ready||!user||!knownDoc||saveFailed)return false;
 pendingCount++;status.textContent='☁ 저장 중…';
 queue=queue.then(async()=>{let next=revision+1;await runTransaction(db,async tx=>{const snap=await tx.get(ref);if(!snap.exists())throw Error('공유 문서가 없습니다.');const v=Number(snap.data().revision)||0;if(v!==revision)throw Error('다른 기기에서 먼저 수정했습니다. 최신 일정을 다시 불러와야 합니다.');next=v+1;tx.update(ref,{planner:payload,revision:next,updatedAt:new Date().toISOString()});});revision=next;pendingCount--;status.textContent=pendingCount?'☁ 저장 중…':'☁ 클라우드 저장 완료';}).catch(e=>{saveFailed=true;pendingCount=0;ready=false;window.__weddingCloudSave=null;show('retry','저장 실패: '+e.message+'\n상단 「↓ 백업」으로 현재 데이터 백업 후 다시 연결하세요.');});return true;
